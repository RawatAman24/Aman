<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | StayEase</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
}

nav{
    background:#0d3b66;
    color:#fff;
    padding:18px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.container{
    width:90%;
    max-width:1200px;
    margin:40px auto;
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:30px;
}

.payment-box,
.summary-box{
    background:#fff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.payment-box h2,
.summary-box h2{
    margin-bottom:20px;
}

.payment-methods{
    display:flex;
    gap:20px;
    margin-bottom:25px;
    flex-wrap:wrap;
}

.payment-methods label{
    cursor:pointer;
    font-weight:bold;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
}

.summary-item{
    display:flex;
    justify-content:space-between;
    margin:15px 0;
}

.total{
    font-size:26px;
    color:#0d3b66;
    font-weight:bold;
}

button{
    width:100%;
    padding:15px;
    border:none;
    background:#ff9800;
    color:#fff;
    font-size:18px;
    border-radius:8px;
    cursor:pointer;
    margin-top:25px;
}

button:hover{
    background:#e68900;
}

#upiBox,
#bankBox{
    display:none;
}

@media(max-width:900px){
.container{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<nav>
<div class="logo">
<i class="fa-solid fa-hotel"></i> StayEase
</div>
</nav>

<div class="container">

<div class="payment-box">

<h2>Payment Details</h2>

<div class="payment-methods">

<label>
<input type="radio" name="payment" value="card" checked onchange="changePayment()">
 Card
</label>

<label>
<input type="radio" name="payment" value="upi" onchange="changePayment()">
 UPI
</label>

<label>
<input type="radio" name="payment" value="bank" onchange="changePayment()">
 Net Banking
</label>

</div>

<form id="paymentForm">

<div id="cardBox">

<div class="form-group">
<label>Card Holder Name</label>
<input type="text" required>
</div>

<div class="form-group">
<label>Card Number</label>
<input type="text" maxlength="16" placeholder="1234567812345678" required>
</div>

<div class="form-group">
<label>Expiry Date</label>
<input type="month" required>
</div>

<div class="form-group">
<label>CVV</label>
<input type="password" maxlength="3" required>
</div>

</div>

<div id="upiBox">

<div class="form-group">
<label>UPI ID</label>
<input type="text" placeholder="example@upi">
</div>

</div>

<div id="bankBox">

<div class="form-group">
<label>Select Bank</label>

<select>

<option>State Bank of India</option>
<option>HDFC Bank</option>
<option>ICICI Bank</option>
<option>Axis Bank</option>
<option>Kotak Mahindra Bank</option>
<option>Bank of Baroda</option>
<option>Punjab National Bank</option>
<option>Canara Bank</option>
</select>

</div>

</div>

<button type="submit"> Pay Now </button><br>

</form>

</div>

<div class="summary-box">

<h2>Booking Summary</h2>

<div class="summary-item">
<span>Hotel</span>
<b>Luxury Palace</b>
</div>

<div class="summary-item">
<span>Room</span>
<b>Deluxe Room</b>
</div>

<div class="summary-item">
<span>Guests</span>
<b>2 Adults</b>
</div>

<div class="summary-item">
<span>Nights</span>
<b>2</b>
</div>

<div class="summary-item">
<span>Room Price</span>
<b>₹4,999</b>
</div>

<hr><br>

<div class="summary-item total">
<span>Total</span>
<span>₹9,998</span>
</div>

</div>

</div>

<script>

function changePayment(){

let payment=document.querySelector('input[name="payment"]:checked').value;

document.getElementById("cardBox").style.display="none";
document.getElementById("upiBox").style.display="none";
document.getElementById("bankBox").style.display="none";

if(payment==="card")
document.getElementById("cardBox").style.display="block";

if(payment==="upi")
document.getElementById("upiBox").style.display="block";

if(payment==="bank")
document.getElementById("bankBox").style.display="block";

}

document.getElementById("paymentForm")
.addEventListener("submit",function(e){

e.preventDefault();

alert("✅ Payment Successful!\n\nYour hotel booking has been confirmed.");

window.location="confirmation.html";

});

</script>

</body>
</html>
