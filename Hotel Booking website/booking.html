<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Hotel | StayEase</title>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 8%;
background:#0d3b66;
color:white;
}

.logo{
font-size:28px;
font-weight:bold;
}

.container{
width:90%;
max-width:1200px;
margin:40px auto;
display:grid;
grid-template-columns:2fr 1fr;
gap:30px;
}

.form-box,
.summary-box{
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.form-group{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

input,
select,
textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:6px;
font-size:15px;
}

textarea{
resize:none;
height:100px;
}

.summary-box h2{
margin-bottom:20px;
}

.summary-item{
display:flex;
justify-content:space-between;
margin:15px 0;
}

.total{
font-size:24px;
font-weight:bold;
color:#0d3b66;
margin-top:20px;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#ff9800;
color:white;
font-size:18px;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#e68900;
}

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<nav>

<div class="logo">
<i class="fa-solid fa-hotel"></i> StayEase
</div>

</nav>

<div class="container">

<div class="form-box">

<h2>Complete Your Booking</h2>

<form id="bookingForm">

<div class="form-group">

<label>Full Name</label>

<input
type="text"
id="name"
required>

</div>

<div class="form-group">

<label>Email</label>

<input
type="email"
id="email"
required>

</div>

<div class="form-group">

<label>Phone</label>

<input
type="tel"
id="phone"
required>

</div>

<div class="form-group">

<label>Check-in Date</label>

<input
type="date"
id="checkin"
required>

</div>

<div class="form-group">

<label>Check-out Date</label>

<input
type="date"
id="checkout"
required>

</div>

<div class="form-group">

<label>Guests</label>

<select id="guests">

<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>

</select>

</div>

<div class="form-group">

<label>Room Type</label>

<select id="room">

<option value="4999">
Deluxe Room - ₹4999
</option>

<option value="6999">
Executive Room - ₹6999
</option>

<option value="9999">
Luxury Suite - ₹9999
</option>

</select>

</div>

<div class="form-group">

<label>Special Request</label>

<textarea
placeholder="Any special request..."></textarea>

</div>

<button type="submit">

Proceed to Payment

</button>

</form>

</div>

<div class="summary-box">

<h2>Booking Summary</h2>

<div class="summary-item">

<span>Hotel</span>

<b>Luxury Palace</b>

</div>

<div class="summary-item">

<span>Location</span>

<b>Ahmedabad</b>

</div>

<div class="summary-item">

<span>Room Price</span>

<b id="roomPrice">

₹4999

</b>

</div>

<div class="summary-item">

<span>Total Nights</span>

<b id="nights">

1

</b>

</div>

<hr>

<div class="total">

Total :

<span id="total">

₹4999

</span>

</div>

</div>

</div>

<script>

const room=document.getElementById("room");

const roomPrice=document.getElementById("roomPrice");

const total=document.getElementById("total");

const checkin=document.getElementById("checkin");

const checkout=document.getElementById("checkout");

const nights=document.getElementById("nights");

function calculate(){

let price=parseInt(room.value);

roomPrice.innerHTML="₹"+price;

let inDate=new Date(checkin.value);

let outDate=new Date(checkout.value);

let diff=(outDate-inDate)/(1000*60*60*24);

if(diff<=0 || isNaN(diff))
diff=1;

nights.innerHTML=diff;

total.innerHTML="₹"+(price*diff);

}

room.onchange=calculate;

checkin.onchange=calculate;

checkout.onchange=calculate;

document.getElementById("bookingForm")
.addEventListener("submit",function(e){

e.preventDefault();

alert("Booking Successful!");

window.location="checkout.html";

});

</script>

</body>
</html>
