<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Contact | FAMMS</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" 
        rel="stylesheet">
        <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    </head>
<body>
    <div id="header"></div>
    <section class="page-banner">
        <div class="container">
            <p class="eyebrow">GET IN TOUCH</p>
            <h1>Contact Us</h1>
        </div>
    </section>
<section class="section">
    <div class="container contact-grid"><div>
        <h2>Let's talk.</h2>
        <p>Have a question about an order, product or return? Send us a message.</p>
        <div class="contact-item">
            <i class="fa fa-location-dot"></i>
            <span>Ahmedabad, Gujarat, India</span>
        </div>
        <div class="contact-item">
            <i class="fa fa-phone"> </i>
            <span>+91 98765 43210</span>
        </div>
        <div class="contact-item">
            <i class="fa fa-envelope"></i>
            <span>support@famms.example</span>
        </div>
    </div>
    <form class="form-card" id="contactForm">
        <input required placeholder="Your name">
        <input required type="email" placeholder="Email address">
        <input placeholder="Subject">
        <textarea required placeholder="Your message"></textarea>
        <button class="btn">Send Message</button>
    </form>
</div>
</section>
<div id="footer"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
