<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rawat Aman | Social Media Profile</title>
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="profile-container">
        <div class="profile-card">
            <!-- Profile Image -->
            <div class="profile-image">
                <img src="profile.jpg" alt="Rawat Aman Profile Picture">
            </div>
            <!-- Profile Information -->
            <div class="profile-info">
                <h1>RAWAT AMAN</h1>
                <p class="username">@rawataman</p>
                <p class="role">
                    Web Developer | HTML Learner</p>
                <p class="bio">
                    Sharing my journey of learning and building
                    amazing things on the web.
                </p>
            </div>
            <!-- Statistics -->
            <div class="stats">
                <div class="stat">
                    <h2>120</h2>
                    <span>Posts</span>
                </div>
                <div class="stat">
                    <h2>3K</h2>
                    <span>Followers</span>
                </div>
                <div class="stat">
                    <h2>3.5K</h2>
                    <span>Following</span>
                </div>
            </div>
            <!-- Buttons -->
            <div class="buttons">
                <button class="follow-btn">
                    Follow
                </button>
                <button class="message-btn">
                    Message
                </button>
            </div>
            </div>
        </div>
    </main>
</body>
</html>
