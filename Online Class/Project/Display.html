<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    div{
        display: inline-block;
        padding: 10px;
        margin: 10px;
    }
</style>
<body>
    <div style="background-color: rebeccapurple;">1</div>
    <div style="background-color: aqua;">2</div>
    <div style="background-color: cornflowerblue;">3</div>
    <button>Sign in</button>
    <button>Sign up</button>
</body>
</html>
